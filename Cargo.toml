[workspace]
resolver = "2"
members = ["mbop3", "reference", "regress"]
default-members = ["mbop3", "reference", "regress"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
# Matches the Boppo firmware release profile.
opt-level = 3
lto = "thin"
debug = 1

[profile.dev]
# The decoder is unusably slow unoptimized and the regression corpus is large.
opt-level = 1
