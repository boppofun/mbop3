[package]
name = "mbop3"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A small, no_std MP3 (MPEG-1/2/2.5 Layer III) decoder derived from minimp3, tuned for microcontrollers."
categories = ["multimedia::audio", "no-std", "embedded"]
keywords = ["mp3", "decoder", "audio", "no_std", "embedded"]

[features]
# Decoder::new_boxed(), which allocates the decoder zeroed on the heap instead
# of building it on the stack first.
alloc = ["dep:zerocopy", "zerocopy/alloc"]
# Evaluate floating point in exactly minimp3's order, so output is
# bit-identical to C minimp3 (on targets that don't fuse multiply-adds). Slower
# on the ESP32-S3. Used by the regression tests.
exact = []
# Per-stage cycle counters (mbop3::profile), for tuning. Development only.
profile = []

[dependencies]
zerocopy = { version = "0.8", default-features = false, features = ["derive"], optional = true }
